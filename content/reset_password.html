<div class="account-page content-layout-page">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="#" data-page="start.html">Home</a> › Reset password
  </nav>

  <header class="content-page-header content-page-intro">
    <span class="section-eyebrow">Account recovery</span>
    <h1>Set a new password</h1>
    <p>Choose a new password for your La Cerra account.</p>
  </header>

  <form id="reset-password-form" class="account-form-card" novalidate>
    <fieldset id="reset-password-fields">
      <div class="form-field">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" name="new-password" minlength="10" autocomplete="new-password" required />
      </div>
      <div class="form-field">
        <label for="confirm-new-password">Repeat new password</label>
        <input type="password" id="confirm-new-password" name="confirm-new-password" minlength="10" autocomplete="new-password" required />
      </div>
    </fieldset>
    <button type="submit">Save new password</button>
    <p class="form-note" data-reset-password-status role="status" aria-live="polite">Checking recovery link…</p>
    <p data-reset-login hidden><a href="#" data-page="start.html">Return to the website</a></p>
  </form>
</div>
