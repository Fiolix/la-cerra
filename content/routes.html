<div class="routes-page content-layout-page" data-routes-directory>
  <header class="content-page-header content-page-intro">
    <h1>Routes</h1>
    <p>Search sectors, boulders and routes, or explore every published route at La Cerra.</p>
  </header>

  <div class="routes-tabs" role="tablist" aria-label="Route directory">
    <button id="routes-search-tab" type="button" role="tab" aria-selected="false" aria-controls="routes-search-panel" tabindex="-1" data-routes-tab="search">Search results</button>
    <button id="routes-all-tab" type="button" role="tab" aria-selected="true" aria-controls="routes-all-panel" tabindex="0" data-routes-tab="all">All routes</button>
  </div>

  <section id="routes-search-panel" class="routes-tab-panel" role="tabpanel" aria-labelledby="routes-search-tab" data-routes-panel="search" hidden>
    <form class="routes-search-form" data-routes-search-form role="search">
      <label for="routes-search-input">Search La Cerra</label>
      <div class="routes-search-row">
        <input id="routes-search-input" type="search" autocomplete="off" placeholder="Route, boulder or sector" />
        <button type="submit">Search</button>
      </div>
    </form>
    <p class="routes-result-summary" data-routes-search-summary aria-live="polite"></p>
    <div class="routes-search-results" data-routes-search-results></div>
  </section>

  <section id="routes-all-panel" class="routes-tab-panel" role="tabpanel" aria-labelledby="routes-all-tab" data-routes-panel="all">
    <div class="route-directory-controls">
      <div class="route-filter route-filter-keyword">
        <label for="route-list-keyword">Filter routes</label>
        <input id="route-list-keyword" type="search" autocomplete="off" placeholder="Name, boulder or description" />
      </div>
      <div class="route-filter">
        <label for="route-list-sector">Sector</label>
        <select id="route-list-sector"><option value="all">All sectors</option></select>
      </div>
      <div class="route-filter route-filter-grade">
        <label for="route-list-grade-min">Grade from</label>
        <select id="route-list-grade-min"><option value="">Any</option></select>
      </div>
      <div class="route-filter route-filter-grade">
        <label for="route-list-grade-max">Grade to</label>
        <select id="route-list-grade-max"><option value="">Any</option></select>
      </div>
      <label class="route-project-filter" for="route-list-projects">
        <input id="route-list-projects" type="checkbox" checked />
        Include open projects
      </label>
      <button type="button" class="text-link small as-link route-filter-reset" data-route-filter-reset>Reset filters</button>
    </div>

    <div class="route-directory-status">
      <p data-route-list-count aria-live="polite">Loading routes…</p>
    </div>
    <div class="public-route-list" data-public-route-list aria-busy="true"></div>
    <div class="route-directory-pagination" data-route-list-pagination></div>
  </section>
</div>
