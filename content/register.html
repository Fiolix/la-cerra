<div class="account-page content-layout-page">
  <nav class="breadcrumb">
    <a href="#" data-page="start.html">Home</a> ›
    <a href="#" data-page="register.html">Register</a>
  </nav>

  <header class="content-page-header content-page-intro">
    <span class="section-eyebrow">Join La Cerra</span>
    <h1>Create account</h1>
    <p>Keep a personal ticklist and save the routes you want to climb next.</p>
  </header>

  <form class="register-form account-form-card">
    <p class="form-note">Please fill out all fields. Your username will be visible to others later on.</p>

  <div class="form-field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" minlength="3" maxlength="30" autocomplete="username" required />
  </div>

  <div class="form-field">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required />
  </div>

  <div class="form-field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required />
  </div>

  <div class="form-field">
    <label for="confirm-password">Repeat password</label>
    <input type="password" id="confirm-password" name="confirm-password" required />
  </div>

    <button type="submit" id="register-button">Register</button>
  </form>
</div>
